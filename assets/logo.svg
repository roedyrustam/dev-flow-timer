<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="breakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Track Ring (Dark/Light Neutral) -->
  <circle cx="128" cy="128" r="92" fill="none" stroke="#334155" stroke-width="14" stroke-opacity="0.3" />

  <!-- Active Coding Progress Arc (Emerald to Cyan) -->
  <path d="M 128 36 A 92 92 0 1 1 50 178" fill="none" stroke="url(#flowGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />

  <!-- Break Arc Segment (Amber / Coral) -->
  <path d="M 60 192 A 92 92 0 0 1 116 36.5" fill="none" stroke="url(#breakGrad)" stroke-width="14" stroke-linecap="round" stroke-dasharray="14 10" />

  <!-- Center Timer Disc Background -->
  <circle cx="128" cy="128" r="62" fill="#0f172a" />
  <circle cx="128" cy="128" r="62" fill="none" stroke="#1e293b" stroke-width="3" />

  <!-- Code Symbol Inside Disc: < / > -->
  <!-- Left Chevron < -->
  <path d="M 112 110 L 96 128 L 112 146" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Chevron > -->
  <path d="M 144 110 L 160 128 L 144 146" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Slash / -->
  <line x1="134" y1="106" x2="122" y2="150" stroke="#f1f5f9" stroke-width="4.5" stroke-linecap="round" />

  <!-- Small Clock Top Node -->
  <circle cx="128" cy="36" r="6" fill="#10b981" />
  <circle cx="128" cy="36" r="2.5" fill="#ffffff" />
</svg>
