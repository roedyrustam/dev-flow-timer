name: DevFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate syntax
        run: |
          node --check bin/cli.mjs
          node --check bin/mcp-server.mjs
          node --check sidecars/devflow-panel/server.mjs
          node --check lib/timer-engine.mjs
          node --check lib/dashboard-generator.mjs
          node --check lib/analytics-reporter.mjs

      - name: Verify MCP JSON-RPC protocol
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | node bin/mcp-server.mjs
